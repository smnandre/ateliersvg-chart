<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="720" height="240" viewBox="0 0 720 240" font-family="system-ui, -apple-system, sans-serif" role="img" aria-label="Production cycle"><title>Production cycle</title><desc>Production, pause, then production again, weighted 12 to 3 to 9. Chart data. Production: weight 12; Pause: weight 3; Production: weight 9.</desc><rect x="0" y="0" width="720" height="240" rx="0" fill="#010205"/><text x="28" y="36" fill="#e5e8ed" font-size="18" font-weight="600" text-anchor="start">Production cycle</text><rect x="28" y="72" width="332" height="56" rx="0" fill="#06bfa8"/><rect x="360" y="72" width="83" height="56" rx="0" fill="#f4a34b"/><rect x="443" y="72" width="249" height="56" rx="0" fill="#06bfa8"/><rect x="28" y="149" width="12" height="4" rx="2" fill="#06bfa8"/><text x="47" y="156" fill="#e5e8ed" font-size="11" font-weight="600" text-anchor="start">Production</text><rect x="194" y="149" width="12" height="4" rx="2" fill="#f4a34b"/><text x="213" y="156" fill="#e5e8ed" font-size="11" font-weight="600" text-anchor="start">Pause</text></svg>
