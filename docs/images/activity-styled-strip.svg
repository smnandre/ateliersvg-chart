<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="720" height="220" viewBox="0 0 720 220" font-family="system-ui, -apple-system, sans-serif" role="img" aria-label="Colors for selected cells"><title>Colors for selected cells</title><desc>Two cells override the series color at full opacity, and summary() labels the strip. Chart data. Deploys: Mon 2, Tue 4, Wed 3, Thu 8, Fri 1, Sat 0, Sun 2.</desc><rect x="0" y="0" width="720" height="220" rx="0" fill="#010205"/><text x="28" y="36" fill="#e5e8ed" font-size="18" font-weight="600" text-anchor="start">Colors for selected cells</text><rect x="29" y="82" width="92.86" height="56" rx="2" fill="#48c5ff" fill-opacity="0.42"/><rect x="123.86" y="82" width="92.86" height="56" rx="2" fill="#48c5ff" fill-opacity="0.61"/><rect x="218.71" y="82" width="92.86" height="56" rx="2" fill="#48c5ff" fill-opacity="0.51"/><rect x="313.57" y="82" width="92.86" height="56" rx="2" fill="#06bfa8" fill-opacity="1"/><rect x="408.43" y="82" width="92.86" height="56" rx="2" fill="#f4a34b" fill-opacity="1"/><rect x="503.29" y="82" width="92.86" height="56" rx="2" fill="#1b1f26" fill-opacity="1"/><rect x="598.14" y="82" width="92.86" height="56" rx="2" fill="#48c5ff" fill-opacity="0.42"/><text x="28" y="162" fill="#b8bec8" font-size="10" font-weight="550" text-anchor="start">Mon</text><text x="692" y="162" fill="#b8bec8" font-size="10" font-weight="550" text-anchor="end">Sun</text><text x="360" y="162" fill="#e5e8ed" font-size="11" font-weight="650" text-anchor="middle">Release on Thursday; rollback on Friday</text></svg>
